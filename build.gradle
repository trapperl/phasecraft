plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Sodium, for the Sodium client GameTests only (never part of the mod).
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// Sodium (Modrinth) replaces Minecraft's chunk renderer and is in most
// players' mod lists, so the client GameTests also run with it. Loaded into
// that one run only, with Fabric Loader's fabric.addMods.
configurations {
    sodium { transitive = false }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    sodium "maven.modrinth:sodium:${project.sodium_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Client-only code (the overlay renderer, key mappings) lives in src/client.
// Must come before configureTests, which builds on the source sets.
loom {
    splitEnvironmentSourceSets()
    mods {
        phasecraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Dev tools (src/devtools, mod phasecraft-devtools): commands for tools/mcb, loaded
// only by the dev server (runServer), never shipped with the mod.
sourceSets {
    devtools {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        phasecraftDevtools {
            sourceSet sourceSets.devtools
        }
    }
    runs {
        server {
            source sourceSets.devtools
        }
    }
}
tasks.named('check') { dependsOn tasks.named('compileDevtoolsJava') }

// Unit tests of the Python tools (tools/mcb), with the build.
tasks.register('mcbTest', Exec) {
    description = 'Unit tests of tools/mcb (Python).'
    workingDir projectDir
    commandLine 'python3', '-B', '-m', 'unittest', 'discover', '-s', 'tools/mcb/tests', '-t', 'tools'
}
tasks.named('check') { dependsOn tasks.named('mcbTest') }

// In-game GameTests live in src/gametest as a separate test mod
// (phasecraft-test). Each run starts a headless server, runs the selected
// @GameTests, writes a JUnit-style report and exits non-zero on failure.
//
//   ./gradlew runGameTest   ordinary tests: classes named *GameTests
//   ./gradlew restartTest   two server processes on one world folder:
//                           PhaseLayerRestartPhases write, then verify
//   ./gradlew clientTest    client GameTests (src/gametest/.../client): a real
//                           client, with OpenGL, with Vulkan, and with OpenGL
//                           plus the Sodium mod,
//                           taking screenshots (build/run/clientGameTest*/screenshots)
//   ./gradlew check         unit tests + all of the above (build runs it)
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'phasecraft-test'
        enableGameTests = true
        enableClientGameTests = true
        // The dedicated server in the client GameTests needs the Minecraft
        // EULA accepted (https://aka.ms/MinecraftEULA); the project owner has.
        eula = true
    }
}

def gameTestArgs = { String report, String filter ->
    ["-Dfabric-api.gametest.report-file=${layout.buildDirectory.file("reports/gametest/TEST-${report}.xml").get().asFile}",
     "-Dfabric-api.gametest.filter=${filter}"]
}
def restartRunDir = 'build/run/restartTest'

// Test games never talk to Mojang or Microsoft. They run offline anyway, but
// every client and server still contacted Mojang's service discovery (and
// the client Realms) at start; dozens of test runs in an afternoon got this
// network's address blocked by Mojang's front door (2026-11-22). Discovery
// points at a closed local port instead, so the services are never looked
// up; Realms uses its "local" setting (localhost:8080). Checked by
// NoMojangTrafficGameTests and the client GameTests.
def offlineTestArgs = ['-Dminecraft.api.discovery.host=http://127.0.0.1:9/minecraft/client',
                       '-Drealms.environment=local']

loom {
    runs {
        // Declared before gameTest's own arguments are added, so they inherit
        // only what Loom set up (server side, gametest source set, Fabric flags).
        restartWrite {
            inherit gameTest
            configName = 'GameTest: restart, write phase'
            runDir = restartRunDir
            vmArgs gameTestArgs('restart-write', 'phasecraft-test:phase_layer_restart_phases_write*')
            vmArgs offlineTestArgs
        }
        restartVerify {
            inherit gameTest
            configName = 'GameTest: restart, verify phase'
            runDir = restartRunDir
            vmArgs gameTestArgs('restart-verify', 'phasecraft-test:phase_layer_restart_phases_verify*')
            vmArgs offlineTestArgs
        }
        gameTest {
            // -PgameTestFilter=phasecraft-test:line_shifter_game_tests_* runs only some tests;
            // -PgameTestVmArgs="-Dname=value ..." passes switches to the test server (see
            // GameTestInfoHiddenChunksMixin and HiddenChunkDelayMixin in the test mod).
            vmArgs gameTestArgs('gametest', (findProperty('gameTestFilter') ?: 'phasecraft-test:*_game_tests_*').toString())
            vmArgs offlineTestArgs
            vmArgs((findProperty('gameTestVmArgs') ?: '').toString().split(' ').findAll { it })
        }
        clientGameTestVulkan {
            inherit clientGameTest
            configName = 'Client GameTest: Vulkan'
            runDir = 'build/run/clientGameTestVulkan'
            vmArg '-Dphasecraft.test.graphicsApi=vulkan'
            vmArgs offlineTestArgs
        }
        clientGameTestSodium {
            inherit clientGameTest
            configName = 'Client GameTest: OpenGL with Sodium'
            runDir = 'build/run/clientGameTestSodium'
            vmArg '-Dphasecraft.test.graphicsApi=opengl'
            vmArg '-Dphasecraft.test.sodium=true'
            vmArgs offlineTestArgs
        }
        clientGameTest {
            configName = 'Client GameTest: OpenGL'
            vmArg '-Dphasecraft.test.graphicsApi=opengl'
            vmArgs offlineTestArgs
        }
    }
}

tasks.register('cleanRestartTest', Delete) {
    delete restartRunDir
}
tasks.named('runRestartWrite') {
    dependsOn 'cleanRestartTest'
}
tasks.named('runRestartVerify') {
    dependsOn 'runRestartWrite'
}
tasks.register('restartTest') {
    group = 'verification'
    description = 'Writes hidden cells, stops the server, starts a new one and verifies them.'
    dependsOn 'runRestartVerify'
}

// Client GameTests open a game window. When Xvfb is installed they get a
// private virtual display instead, so nothing appears on your screen and they
// run the same way in CI. Without Xvfb they use your display.
def xvfb = ['/usr/bin/Xvfb', '/usr/local/bin/Xvfb'].find { new File(it).canExecute() }
['runClientGameTest', 'runClientGameTestVulkan', 'runClientGameTestSodium'].each { name ->
    tasks.named(name) { task ->
        def server = null
        doFirst {
            if (xvfb == null) {
                logger.lifecycle("${name}: Xvfb not found, using your display")
                return
            }
            // Try display numbers until one is free; -displayfd prints the number once ready.
            String number = null
            for (int candidate in (90..199).findAll { !new File("/tmp/.X${it}-lock").exists() }.take(5)) {
                server = new ProcessBuilder(xvfb, ":${candidate}", '-displayfd', '1', '-screen', '0', '1280x720x24', '-nolisten', 'tcp')
                        .redirectError(ProcessBuilder.Redirect.DISCARD).start()
                number = new BufferedReader(new InputStreamReader(server.inputStream)).readLine()?.trim()
                if (number == "${candidate}") {
                    break
                }
                server.destroy()
                server = null
                number = null
            }
            if (number == null) {
                throw new GradleException('Xvfb did not start (tried 5 display numbers)')
            }
            task.environment('DISPLAY', ":${number}")
            task.environment.remove('WAYLAND_DISPLAY')
            task.environment('SDL_VIDEODRIVER', 'x11')
            // Xvfb offers no GLX visual SDL accepts; EGL works (Mesa software rendering).
            task.environment('SDL_VIDEO_FORCE_EGL', '1')
            logger.lifecycle("${name}: running on virtual display :${number}")
        }
        doLast { server?.destroy() }
        // A failing run skips doLast; stop the display anyway.
        task.ext.stopDisplay = { server?.destroy() }
    }
}
gradle.taskGraph.afterTask { task ->
    if (task.ext.has('stopDisplay')) {
        task.ext.stopDisplay()
    }
}
tasks.register('clientTest') {
    group = 'verification'
    description = 'Runs the client GameTests with OpenGL, with Vulkan, and with OpenGL and Sodium.'
    dependsOn 'runClientGameTest', 'runClientGameTestVulkan', 'runClientGameTestSodium'
}
['runClientGameTestVulkan', 'runClientGameTestSodium'].each { name ->
    def runDir = name == 'runClientGameTestVulkan' ? 'build/run/clientGameTestVulkan' : 'build/run/clientGameTestSodium'
    tasks.named(name) { task ->
        mustRunAfter 'runClientGameTest'
        dependsOn 'acceptGameTestEula'
        // Loom accepts the EULA (see configureTests) only in the default run folder.
        def eulaFile = file("${runDir}/eula.txt")
        doFirst {
            eulaFile.parentFile.mkdirs()
            eulaFile.text = '# Accepted for the test server, as in build/run/clientGameTest.\neula=true\n'
        }
    }
}
tasks.named('runClientGameTestSodium') { task ->
    mustRunAfter 'runClientGameTestVulkan'
    def sodiumJars = configurations.sodium
    inputs.files(sodiumJars)
    doFirst {
        task.jvmArgs "-Dfabric.addMods=${sodiumJars.singleFile.absolutePath}"
    }
}
tasks.named('check') {
    dependsOn 'runGameTest', 'restartTest', 'clientTest'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// The license goes in the jar, as MIT asks ("included in all copies").
jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Build-to-play: ./gradlew installToMinecraft runs the full build (unit tests,
// GameTests, restart test) and, only if all pass, replaces PhaseCraft in your
// Minecraft mods folder. Set the folder in local.properties (git-ignored):
//   minecraftModsDir=/mnt/c/Users/<you>/AppData/Roaming/.minecraft/mods
def localProps = new Properties()
def localPropsFile = file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

tasks.register('installToMinecraft') {
    group = 'phasecraft'
    description = 'Builds and tests the mod, then installs it into your Minecraft mods folder.'
    dependsOn 'build'
    def modsPath = localProps.getProperty('minecraftModsDir') ?: System.getenv('MINECRAFT_MODS_DIR')
    def remapJar = tasks.named('jar').flatMap { it.archiveFile }
    def apiVersion = project.fabric_api_version
    doLast {
        if (!modsPath) {
            throw new GradleException('Set minecraftModsDir in local.properties (or MINECRAFT_MODS_DIR) to your Minecraft mods folder.')
        }
        def mods = new File(modsPath)
        if (!mods.isDirectory()) {
            throw new GradleException("Mods folder not found: ${mods}")
        }
        def built = remapJar.get().asFile
        mods.listFiles().findAll { it.name ==~ /phasecraft-.*\.jar/ }.each { old ->
            if (!old.delete()) {
                throw new GradleException("Could not remove ${old.name}: close Minecraft first, then rerun.")
            }
            logger.lifecycle("Removed old ${old.name}")
        }
        java.nio.file.Files.copy(built.toPath(), new File(mods, built.name).toPath())
        logger.lifecycle("Installed ${built.name} into ${mods}")
        if (!mods.listFiles().any { it.name == "fabric-api-${apiVersion}.jar" }) {
            logger.warn("Warning: fabric-api-${apiVersion}.jar is not in the mods folder; PhaseCraft needs it.")
        }
        logger.lifecycle('Restart Minecraft (Fabric 26.3 profile) to load the new build.')
    }
}
