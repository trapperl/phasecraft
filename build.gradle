plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// In-game GameTests live in src/gametest as a separate test mod
// (phasecraft-test). Run them with ./gradlew runGameTest: a headless
// server starts, runs every @GameTest, writes a JUnit-style report and exits
// non-zero if a required test fails.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'phasecraft-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}

loom {
    runs {
        gameTest {
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('reports/gametest/TEST-gametest.xml').get().asFile}"
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
