name: Build PhaseCraft

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software graphics (client GameTests), and Pillow (tools/mcb pictures)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 python3-pil
      - name: Build and run all tests (JUnit, GameTests, restart test, client GameTests)
        run: ./gradlew --no-daemon clean build
      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/reports/gametest/
          if-no-files-found: ignore
      - name: Upload client GameTest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-screenshots
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTestVulkan/screenshots/
          if-no-files-found: ignore
      - name: Upload development mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phasecraft-26.3-dev-jar
          path: build/libs/phasecraft-*.jar
