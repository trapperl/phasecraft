name: Build PhaseCraft

# One run per change: pull requests build on each push to them; main builds after each merge. (Both push and
# pull_request on every branch built each push to a PR twice.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install a virtual display and software graphics (client GameTests), and Pillow (tools/mcb pictures)
        # A broken third-party source on the runner (packages.microsoft.com answered 403 on 2026-11-26) fails
        # `apt-get update` though Ubuntu's own lists were fetched: warn and go on; a missing package still fails below.
        run: |
          sudo apt-get update || echo "::warning::apt-get update reported errors (a third-party source?); installing from the lists fetched"
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 python3-pil
      - name: Build and run all tests (JUnit, GameTests, restart test, client GameTests)
        run: ./gradlew --no-daemon clean build
      - name: Upload GameTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: build/reports/gametest/
          if-no-files-found: ignore
      - name: Upload client GameTest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-screenshots
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTestVulkan/screenshots/
            build/run/clientGameTestSodium/screenshots/
            build/run/clientGameTestIrisShaders/screenshots/
          if-no-files-found: ignore
      - name: Upload development mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phasecraft-26.3-dev-jar
          path: build/libs/phasecraft-*.jar
