# Minecraft 26.3 is the latest stable Java release as of 2026-11-22.
# Fabric versions follow the official 26.3 example mod template.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.166.2+26.3

mod_version=0.1.0
maven_group=dev.phasecraft
archives_base_name=phasecraft
sodium_version=mc26.3-0.9.3-fabric
# Iris, loaded by the two Iris client GameTest runs only, with the Sodium it works with. 1.11.7 is the newest Iris for 26.3
# (2026-11-27) and needs Sodium 0.9.2: Sodium 0.9.3 and later refuse to start with Iris 1.12.0 or older. When
# an Iris newer than 1.12.0 is out for 26.3, set iris_sodium_version to sodium_version.
iris_version=1.11.7+26.3-fabric
iris_sodium_version=mc26.3-0.9.2-fabric
# The shader pack of runClientGameTestIrisShaders: MakeUp - Ultra Fast (LGPL-3.0-or-later).
shader_pack_version=9.6a
# The trailer's shader pack (runClientGameTestTrailer): Complementary Reimagined (Complementary License Agreement).
trailer_pack_version=r5.9.3
lithium_version=mc26.3-0.26.4-fabric
common_protection_api_version=2.0.0
# Open Parties and Claims, compiled against and loaded by runGameTestOpac only (Modrinth version numbers;
# Forge Config API Port by version id, JpKvrr9J = 26.3.1 for Fabric: the number is shared with other loaders).
opac_version=fabric-26.3-0.33.0
forge_config_api_port_version=JpKvrr9J
